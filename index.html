<body>
  <main class="app">
    <header>
      <div>
        <h1>✨ Nova AI</h1>
        <p>Your personal AI assistant</p>
        <div class="status" id="status">● Ready to chat</div>
      </div>

      <select id="model" aria-label="Select AI model">
        <option value="llama-3.3-70b-versatile">
          Llama 3.3 70B
        </option>
        <option value="openai/gpt-oss-20b">
          GPT OSS 20B
        </option>
      </select>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="emoji">🤖</div>
        <h2>Welcome to Nova AI</h2>
        <p>Ask questions, learn programming, brainstorm ideas,
          or get help with your projects.</p>
      </div>
    </section>

    <section class="composer">
      <p class="note">
        Demo only: a browser-entered API key is not secret.
        Never publish a real API key in this page.
      </p>

      <div class="key-row">
        <input
          id="apiKey"
          type="password"
          placeholder="Paste a temporary Groq API key"
          autocomplete="off"
          aria-label="Temporary Groq API key"
        >
      </div>

      <div class="input-row">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Message Nova AI..."
          aria-label="Your message"
        ></textarea>
        <button id="sendBtn" onclick="sendMessage()">Send ➤</button>
      </div>

      <div class="tools">
        <span>Powered by Groq</span>
        <button class="secondary" onclick="clearChat()">Clear chat</button>
      </div>
    </section>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const apiKeyInput = document.getElementById("apiKey");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");

    let messages = [];

    function addMessage(text, role) {
      const row = document.createElement("div");
      row.className = "message " + (role === "user" ? "user" : "bot");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "👤" : "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      // Use textContent to safely display user and AI text.
      bubble.textContent = text;

      row.append(avatar, bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    async function sendMessage() {
      const text = promptInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text || sendBtn.disabled) return;

      if (!apiKey) {
        statusText.textContent = "Enter a temporary API key to test.";
        apiKeyInput.focus();
        return;
      }

      document.getElementById("welcome")?.remove();

      promptInput.value = "";
      promptInput.style.height = "auto";

      addMessage(text, "user");
      messages.push({ role: "user", content: text });

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "Nova is thinking...";
      chat.appendChild(typing);

      sendBtn.disabled = true;
      statusText.textContent = "● Generating response...";

      try {
        const response = await fetch(
          "https://api.groq.com/openai/v1/chat/completions",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + apiKey
            },
            body: JSON.stringify({
              model: document.getElementById("model").value,
              messages: [
                {
                  role: "system",
                  content: "You are Nova, a helpful and friendly AI assistant. Give clear, accurate answers. Use simple language when appropriate."
                },
                ...messages.slice(-20)
              ],
              temperature: 0.7,
              max_tokens: 1000
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error?.message || "API request failed: " + response.status
          );
        }

        const answer =
          data.choices?.[0]?.message?.content ||
          "I couldn't generate a response. Please try again.";

        messages.push({ role: "assistant", content: answer });
        addMessage(answer, "assistant");
        statusText.textContent = "● Ready to chat";

      } catch (error) {
        // Remove the failed user turn from conversation history so
        // a retry does not leave an unmatched message.
        messages.pop();

        addMessage(
          "Sorry, something went wrong.\n" + error.message +
          "\n\nCheck your API key, model availability, quota, and network.",
          "assistant"
        );

        statusText.textContent = "● Request failed";
      } finally {
        typing.remove();
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    function clearChat() {
      messages = [];
      chat.replaceChildren();

      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.id = "welcome";

      const emoji = document.createElement("div");
      emoji.className = "emoji";
      emoji.textContent = "🤖";

      const heading = document.createElement("h2");
      heading.textContent = "Chat cleared!";

      const description = document.createElement("p");
      description.textContent = "What would you like to ask me?";

      welcome.append(emoji, heading, description);
      chat.appendChild(welcome);
      statusText.textContent = "● Ready to chat";
    }

    sendBtn.addEventListener("click", sendMessage);

    promptInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    promptInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 130) + "px";
    });
  </script>
</body>
</html>
