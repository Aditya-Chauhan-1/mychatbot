<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Web - Nova AI</title>

  <!-- Markdown Parser & Code Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --wa-bg: #0c1317;
      --wa-header: #202c33;
      --wa-footer: #202c33;
      --wa-incoming: #202c33;
      --wa-outgoing: #005c4b;
      --wa-text: #e9edef;
      --wa-muted: #8696a0;
      --wa-green: #00a884;
      --wa-blue-tick: #53bdeb;
      --wa-input-bg: #2a3942;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Segoe UI, Helvetica Neue, Arial, sans-serif;
    }

    body {
      background: #111b21;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Container */
    .whatsapp-app {
      width: 100%;
      max-width: 950px;
      height: 96vh;
      display: flex;
      flex-direction: column;
      background: var(--wa-bg);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 1px solid #222d34;
    }

    /* WhatsApp Header */
    header {
      background: var(--wa-header);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #2a3942;
      z-index: 10;
    }

    .chat-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .profile-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00a884, #005c4b);
      display: grid;
      place-items: center;
      color: white;
      font-size: 20px;
      position: relative;
    }

    .online-indicator {
      width: 10px;
      height: 10px;
      background: #25d366;
      border: 2px solid var(--wa-header);
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
    }

    .profile-info h2 {
      font-size: 16px;
      color: var(--wa-text);
      font-weight: 500;
    }

    .profile-info p {
      font-size: 12.5px;
      color: var(--wa-muted);
      margin-top: 1px;
    }

    .header-icons {
      display: flex;
      align-items: center;
      gap: 18px;
      color: var(--wa-muted);
      font-size: 18px;
    }

    .header-icons i {
      cursor: pointer;
      transition: color 0.2s;
    }

    .header-icons i:hover {
      color: var(--wa-text);
    }

    /* Chat Area with WhatsApp Pattern */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: #0b141a;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
      scroll-behavior: smooth;
    }

    #chat-box::-webkit-scrollbar {
      width: 6px;
    }
    #chat-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    /* Date Capsule */
    .date-pill {
      align-self: center;
      background: #182229;
      color: var(--wa-muted);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* WhatsApp Message Rows */
    .msg-row {
      display: flex;
      width: 100%;
      animation: popIn 0.15s ease-out;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.ai {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 78%;
      padding: 7px 11px 8px 11px;
      border-radius: 8px;
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--wa-text);
      position: relative;
      word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .msg-row.user .msg-bubble {
      background: var(--wa-outgoing);
      border-top-right-radius: 0;
    }

    .msg-row.ai .msg-bubble {
      background: var(--wa-incoming);
      border-top-left-radius: 0;
    }

    /* Message Meta: Time & Ticks */
    .msg-meta {
      float: right;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-left: 12px;
      margin-top: 5px;
      font-size: 11px;
      color: var(--wa-muted);
      user-select: none;
    }

    .blue-tick {
      color: var(--wa-blue-tick);
      font-size: 13px;
    }

    /* Markdown & Code styling inside bubble */
    .msg-bubble p {
      margin-bottom: 6px;
    }
    .msg-bubble p:last-of-type {
      margin-bottom: 0;
    }

    .msg-bubble code:not(pre code) {
      background: rgba(0,0,0,0.3);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      color: #ffd8a8;
      font-size: 13px;
    }

    .code-box {
      margin: 6px 0;
      background: #111b21;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #2a3942;
    }

    .code-top {
      display: flex;
      justify-content: space-between;
      padding: 4px 10px;
      background: #182229;
      color: var(--wa-muted);
      font-size: 11px;
      font-family: monospace;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--wa-muted);
      cursor: pointer;
      font-size: 11px;
    }

    .copy-btn:hover {
      color: var(--wa-text);
    }

    .code-box pre {
      padding: 8px 10px;
      overflow-x: auto;
      margin: 0;
    }

    .code-box pre code {
      font-size: 12.5px;
      background: transparent !important;
      padding: 0 !important;
    }

    /* Typing indicator */
    .typing-box {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 14px;
    }
    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--wa-muted);
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes popIn {
      from { transform: scale(0.97); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* WhatsApp Footer Bar */
    footer {
      background: var(--wa-footer);
      padding: 8px 14px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .footer-btn {
      background: none;
      border: none;
      color: var(--wa-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 8px 6px;
      transition: color 0.2s;
    }

    .footer-btn:hover {
      color: var(--wa-text);
    }

    .input-wrapper {
      flex: 1;
      background: var(--wa-input-bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 5px 12px;
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--wa-text);
      font-size: 14.5px;
      resize: none;
      max-height: 120px;
      min-height: 24px;
      line-height: 1.4;
    }

    .send-circle {
      width: 42px;
      height: 42px;
      background: var(--wa-green);
      border: none;
      border-radius: 50%;
      color: #0b141a;
      display: grid;
      place-items: center;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-circle:hover {
      transform: scale(1.05);
      background: #06cf9c;
    }

    .send-circle:disabled {
      background: #2a3942;
      color: #8696a0;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 600px) {
      body { padding: 0; }
      .whatsapp-app { height: 100dvh; border-radius: 0; border: none; }
      .msg-bubble { max-width: 88%; }
    }
  </style>
</head>

<body>
  <div class="whatsapp-app">
    <!-- Header -->
    <header>
      <div class="chat-profile">
        <div class="profile-avatar">
          <i class="fa-solid fa-robot"></i>
          <span class="online-indicator"></span>
        </div>
        <div class="profile-info">
          <h2>Nova AI</h2>
          <p id="chat-status">online</p>
        </div>
      </div>
      <div class="header-icons">
        <i class="fa-solid fa-phone" title="Call"></i>
        <i class="fa-solid fa-video" title="Video Call"></i>
        <i class="fa-solid fa-ellipsis-vertical" id="clear-chat" title="Clear Chat"></i>
      </div>
    </header>

    <!-- Chat Messages -->
    <div id="chat-box">
      <div class="date-pill">TODAY</div>
      
      <!-- Welcome message -->
      <div class="msg-row ai">
        <div class="msg-bubble">
          Hello! 👋 Main aapka personal AI assistant hoon. Aap mujhse koi bhi sawal pooch sakte hain ya coding ke liye keh sakte hain!
          <div class="msg-meta">
            <span class="msg-time" id="welcome-time">12:00 PM</span>
          </div>
        </div>
      </div>
    </div>

    <!-- WhatsApp Input Bar -->
    <footer>
      <button class="footer-btn" title="Emoji"><i class="fa-regular fa-face-smile"></i></button>
      <button class="footer-btn" title="Attach"><i class="fa-solid fa-paperclip"></i></button>

      <div class="input-wrapper">
        <textarea id="chat-input" placeholder="Type a message" rows="1"></textarea>
      </div>

      <button class="send-circle" id="send-btn" title="Send">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </footer>
  </div>

  <script>
    /******************************************************************
     * 🔑 YAHAN APNI GROQ API KEY PASTE KAREIN:
     * Niche quotation ("...") ke andar apni key daal dein.
     ******************************************************************/
    const GROQ_API_KEY = "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";

    const chatBox = document.getElementById("chat-box");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const clearChatBtn = document.getElementById("clear-chat");
    const chatStatus = document.getElementById("chat-status");

    let messages = [];

    // Current time helper (e.g. "11:05 AM")
    function getTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    document.getElementById("welcome-time").textContent = getTime();

    // Markdown Parser setup with Copy Code Box
    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
      const validLang = (language && hljs.getLanguage(language)) ? language : 'plaintext';
      const highlighted = hljs.highlight(code, { language: validLang }).value;
      const langLabel = language || 'code';

      return `
        <div class="code-box">
          <div class="code-top">
            <span>${langLabel}</span>
            <button class="copy-btn" onclick="copySnippet(this)">Copy</button>
          </div>
          <pre><code class="hljs language-${validLang}">${highlighted}</code></pre>
        </div>
      `;
    };

    marked.setOptions({ renderer: renderer, breaks: true, gfm: true });

    window.copySnippet = function(btn) {
      const code = btn.closest('.code-box').querySelector('pre code').innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy"; }, 2000);
      });
    };

    function appendMessage(text, role) {
      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";

      let contentHTML = role === "user" ? document.createTextNode(text).textContent : marked.parse(text);
      const timeStr = getTime();

      const ticks = role === "user" ? `<i class="fa-solid fa-check-double blue-tick"></i>` : "";

      bubble.innerHTML = `
        ${contentHTML}
        <div class="msg-meta">
          <span>${timeStr}</span>
          ${ticks}
        </div>
      `;

      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "msg-row ai";
      row.id = "typing-row";

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble typing-box";
      bubble.innerHTML = `
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      `;

      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById("typing-row");
      if (typing) typing.remove();
    }

    async function handleSend() {
      const text = chatInput.value.trim();
      if (!text || sendBtn.disabled) return;

      if (!GROQ_API_KEY || GROQ_API_KEY === "PASTE_YOUR_GROQ_KEY_HERE") {
        alert("⚠️ Please open this file in VS Code or Notepad and paste your Groq API Key at line 348!");
        return;
      }

      chatInput.value = "";
      chatInput.style.height = "auto";
      sendBtn.disabled = true;

      // Add user message
      appendMessage(text, "user");
      messages.push({ role: "user", content: text });

      chatStatus.textContent = "typing...";
      showTyping();

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${GROQ_API_KEY}`
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              {
                role: "system",
                content: "You are a helpful AI assistant in a chat application. Reply clearly with concise answers and well-formatted code blocks."
              },
              ...messages.slice(-8)
            ],
            temperature: 0.7,
            max_tokens: 1500
          })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || "Failed to fetch response");

        const reply = data.choices[0]?.message?.content || "No reply";
        messages.push({ role: "assistant", content: reply });

        removeTyping();
        appendMessage(reply, "ai");
        chatStatus.textContent = "online";

      } catch (err) {
        removeTyping();
        messages.pop();
        appendMessage(`⚠️ Error: ${err.message}`, "ai");
        chatStatus.textContent = "online";
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    }

    sendBtn.addEventListener("click", handleSend);

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    chatInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    clearChatBtn.addEventListener("click", () => {
      if (confirm("Clear conversation history?")) {
        messages = [];
        chatBox.innerHTML = `
          <div class="date-pill">TODAY</div>
          <div class="msg-row ai">
            <div class="msg-bubble">
              Chat cleared. Ask me anything!
              <div class="msg-meta"><span>${getTime()}</span></div>
            </div>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
