<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI - Assistant</title>

  <!-- Markdown Parser & Code Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .app {
      width: 100%;
      max-width: 900px;
      height: 90vh;
      min-height: 550px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #29334b;
      border-radius: 16px;
      background: #111827;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    header {
      padding: 16px 20px;
      border-bottom: 1px solid #29334b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #131c31;
    }

    header h1 {
      font-size: 19px;
      font-weight: 700;
    }

    .status {
      color: #86efac;
      font-size: 12px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
    }

    select {
      max-width: 200px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      outline: none;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      margin: auto;
      max-width: 440px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .welcome .emoji {
      font-size: 44px;
      margin-bottom: 10px;
    }

    .welcome h2 {
      color: white;
      margin-bottom: 6px;
    }

    .message {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      width: 100%;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #26334d;
      font-size: 15px;
    }

    .user .avatar {
      background: #4f46e5;
    }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 12px;
      background: #1f2937;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: #4338ca;
      white-space: pre-wrap;
    }

    /* Markdown Styling in Bot Bubble */
    .bubble p:not(:last-child) {
      margin-bottom: 10px;
    }

    .bubble ul, .bubble ol {
      margin-left: 20px;
      margin-bottom: 10px;
    }

    .bubble code:not(pre code) {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }

    .bubble pre {
      background: #0b1020;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid #374151;
    }

    .bubble pre code {
      background: transparent;
      padding: 0;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12.5px;
    }

    .composer {
      padding: 14px 20px;
      border-top: 1px solid #29334b;
      background: #131c31;
    }

    .key-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .key-row input {
      flex: 1;
      min-width: 0;
      background: #0b1020;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-size: 13px;
      outline: none;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-width: 0;
      height: 48px;
      max-height: 140px;
      padding: 12px;
      border: 1px solid #374151;
      border-radius: 10px;
      background: #0b1020;
      color: white;
      outline: none;
      line-height: 1.4;
      font-size: 14px;
    }

    textarea:focus, .key-row input:focus {
      border-color: #6366f1;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      background: #6366f1;
      color: white;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #4f46e5;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .secondary {
      background: #273449;
      padding: 6px 12px;
      font-size: 12px;
    }

    .secondary:hover {
      background: #37455d;
    }

    .tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      color: #6b7280;
      font-size: 12px;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      font-size: 13px;
      padding-left: 44px;
    }

    .dot-flashing {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #818cf8;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div>
        <h1>✨ Nova AI</h1>
        <div class="status" id="status">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Ready to chat</span>
        </div>
      </div>

      <select id="model" aria-label="Select AI model">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Versatile)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (Fast)</option>
        <option value="mixtral-8x7b-32768">Mixtral 8x7B (Large Context)</option>
      </select>
    </header>

    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="emoji">🤖</div>
        <h2>Welcome to Nova AI</h2>
        <p>Ask questions, analyze problems, brainstorm ideas, or work on code.</p>
      </div>
    </section>

    <section class="composer">
      <div class="key-row">
        <input
          id="apiKey"
          type="password"
          placeholder="Enter your Groq API Key (gsk_...)"
          autocomplete="off"
        >
      </div>

      <div class="input-row">
        <textarea
          id="prompt"
          placeholder="Ask a question or request code... (Enter to send, Shift+Enter for new line)"
          rows="1"
        ></textarea>
        <button id="sendBtn">Send ➤</button>
      </div>

      <div class="tools">
        <span>Powered by Groq Cloud</span>
        <button class="secondary" id="clearBtn">Clear Chat</button>
      </div>
    </section>
  </main>

  <script>
    const chat = document.getElementById("chat");
    const promptInput = document.getElementById("prompt");
    const apiKeyInput = document.getElementById("apiKey");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const modelSelect = document.getElementById("model");

    let messages = [];

    // Load saved API key if available
    const savedKey = localStorage.getItem("groq_api_key");
    if (savedKey) {
      apiKeyInput.value = "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";
    }

    apiKeyInput.addEventListener("change", () => {
      localStorage.setItem("groq_api_key", apiKeyInput.value.trim());
    });

    // Configure Marked
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    function setStatus(state, msg) {
      statusText.textContent = msg;
      if (state === "loading") {
        statusDot.style.background = "#eab308";
      } else if (state === "error") {
        statusDot.style.background = "#ef4444";
      } else {
        statusDot.style.background = "#22c55e";
      }
    }

    function addMessage(content, role) {
      const row = document.createElement("div");
      row.className = "message " + (role === "user" ? "user" : "bot");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "👤" : "🤖";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      if (role === "user") {
        bubble.textContent = content;
      } else {
        bubble.innerHTML = marked.parse(content);
      }

      row.append(avatar, bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    async function sendMessage() {
      const text = promptInput.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text || sendBtn.disabled) return;

      if (!apiKey) {
        setStatus("error", "API Key required");
        apiKeyInput.focus();
        return;
      }

      document.getElementById("welcome")?.remove();

      promptInput.value = "";
      promptInput.style.height = "48px";

      addMessage(text, "user");
      messages.push({ role: "user", content: text });

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = '<span class="dot-flashing"></span> Nova is thinking...';
      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      sendBtn.disabled = true;
      setStatus("loading", "Generating response...");

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: modelSelect.value,
            messages: [
              {
                role: "system",
                content: "You are Nova, an expert AI assistant. Provide concise, clear answers with accurate code examples formatted in Markdown."
              },
              ...messages.slice(-10) // Retain rolling context
            ],
            temperature: 0.6,
            max_tokens: 1500
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `Request failed with status ${response.status}`);
        }

        const answer = data.choices?.[0]?.message?.content || "No response received.";
        messages.push({ role: "assistant", content: answer });
        addMessage(answer, "assistant");
        setStatus("ready", "Ready to chat");

      } catch (error) {
        messages.pop(); // Revert user message on failed request
        addMessage(`**Error:** ${error.message}\n\nPlease verify your API key and network connection.`, "assistant");
        setStatus("error", "Request failed");
      } finally {
        typing.remove();
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    function clearChat() {
      messages = [];
      chat.replaceChildren();

      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.id = "welcome";
      welcome.innerHTML = `
        <div class="emoji">🤖</div>
        <h2>Welcome to Nova AI</h2>
        <p>Ask questions, analyze problems, brainstorm ideas, or work on code.</p>
      `;

      chat.appendChild(welcome);
      setStatus("ready", "Ready to chat");
    }

    sendBtn.addEventListener("click", sendMessage);
    clearBtn.addEventListener("click", clearChat);

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    promptInput.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 140) + "px";
    });
  </script>
</body>
</html>
